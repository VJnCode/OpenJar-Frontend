name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------------
  # 1. Lint, build and audit production dependencies
  # ------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------------------------
  # 2. Secret scanning
  # ------------------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------------------
  # 3. Container: build + smoke test on every PR, publish to GHCR on main
  # ------------------------------------------------------------------------------------
  image:
    needs: [build, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openjar/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp openjar/frontend:ci
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8080/healthz && break; sleep 1; done
          set -x
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'                       # app shell
          curl -sf http://localhost:8080/recipes/42 | grep -q '<div id="root">'             # SPA deep link
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:'            # security headers
          curl -sI http://localhost:8080/ | grep -qi '^x-frame-options: DENY'
          test "$(docker exec web id -u)" != "0"                                             # not root

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: openjar/frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"        # report only; set to "1" to block releases on fixable HIGH/CRITICAL CVEs

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openjar-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
